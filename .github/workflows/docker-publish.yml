name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: '可选：覆盖 Dockerfile 中的 CADDY_VERSION（留空则自动读取）'
        required: false
        type: string
      push_dockerhub:
        description: '推送到 Docker Hub'
        required: false
        default: true
        type: boolean
      push_aliyun:
        description: '推送到阿里云镜像仓库'
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'mtphotos/caddy' }}
      ALIYUN_REGISTRY_REPO: ${{ vars.ALIYUN_REGISTRY_REPO || 'registry.cn-hangzhou.aliyuncs.com/mtphotos/caddy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Caddy version
        id: version
        shell: bash
        env:
          INPUT_CADDY_VERSION: ${{ inputs.caddy_version }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "${INPUT_CADDY_VERSION:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$VERSION" ]; then
            VERSION="$(awk -F= '/^[[:space:]]*ARG[[:space:]]+CADDY_VERSION=/{sub(/#.*/, "", $2); gsub(/["'\''[:space:]]/, "", $2); print $2; exit}' Dockerfile)"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to resolve CADDY_VERSION from Dockerfile."
            exit 1
          fi
          if [ "$VERSION" = "latest" ]; then
            echo "::error::CADDY_VERSION cannot be 'latest'. Use the 'Promote to Latest' workflow to update latest."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid CADDY_VERSION value: ${VERSION}"
            exit 1
          fi
          echo "caddy_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved CADDY_VERSION=${VERSION}"

      - name: Resolve targets and verify credentials
        id: targets
        shell: bash
        env:
          PUSH_DOCKERHUB: ${{ inputs.push_dockerhub }}
          PUSH_ALIYUN: ${{ inputs.push_aliyun }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          NORMALIZED_DOCKERHUB_REPO="$(printf '%s' "${DOCKERHUB_REPO}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          NORMALIZED_ALIYUN_REPO="$(printf '%s' "${ALIYUN_REGISTRY_REPO}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"

          if [ "${PUSH_DOCKERHUB}" = "true" ] || [ "${PUSH_ALIYUN}" != "true" ]; then
            if [ -z "${NORMALIZED_DOCKERHUB_REPO}" ] || [[ "${NORMALIZED_DOCKERHUB_REPO}" =~ [[:space:]] ]] || [[ "${NORMALIZED_DOCKERHUB_REPO}" == *"://"* ]] || [[ "${NORMALIZED_DOCKERHUB_REPO}" != */* ]]; then
              echo "::error::Invalid DOCKERHUB_REPO '${DOCKERHUB_REPO}'. Expected '<namespace>/<repo>' without scheme or spaces."
              exit 1
            fi
          fi

          ALIYUN_HOST=""
          if [ "${PUSH_ALIYUN}" = "true" ]; then
            if [ -z "${NORMALIZED_ALIYUN_REPO}" ] || [[ "${NORMALIZED_ALIYUN_REPO}" =~ [[:space:]] ]] || [[ "${NORMALIZED_ALIYUN_REPO}" == *"://"* ]] || [[ "${NORMALIZED_ALIYUN_REPO}" != */*/* ]]; then
              echo "::error::Invalid ALIYUN_REGISTRY_REPO '${ALIYUN_REGISTRY_REPO}'. Expected '<registry-host>/<namespace>/<repo>' without scheme or spaces."
              exit 1
            fi
            ALIYUN_HOST="${NORMALIZED_ALIYUN_REPO%%/*}"
            if [ -z "${ALIYUN_HOST}" ]; then
              echo "::error::Failed to extract registry host from ALIYUN_REGISTRY_REPO '${ALIYUN_REGISTRY_REPO}'."
              exit 1
            fi
          fi

          HAS_DOCKERHUB_CREDS="false"
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            HAS_DOCKERHUB_CREDS="true"
          fi

          HAS_ALIYUN_CREDS="false"
          if [ -n "${ALIYUN_REGISTRY_USERNAME:-}" ] && [ -n "${ALIYUN_REGISTRY_PASSWORD:-}" ]; then
            HAS_ALIYUN_CREDS="true"
          fi

          if [ "${PUSH_DOCKERHUB}" = "true" ] && [ "${HAS_DOCKERHUB_CREDS}" != "true" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN. Configure them in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ "${PUSH_ALIYUN}" = "true" ] && [ "${HAS_ALIYUN_CREDS}" != "true" ]; then
            echo "::error::Missing ALIYUN_REGISTRY_USERNAME or ALIYUN_REGISTRY_PASSWORD. Configure them in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          IMAGES=()
          if [ "${PUSH_DOCKERHUB}" = "true" ]; then
            IMAGES+=("${NORMALIZED_DOCKERHUB_REPO}")
          fi
          if [ "${PUSH_ALIYUN}" = "true" ]; then
            IMAGES+=("${NORMALIZED_ALIYUN_REPO}")
          fi

          SHOULD_PUSH="false"
          if [ "${#IMAGES[@]}" -gt 0 ]; then
            SHOULD_PUSH="true"
          else
            IMAGES+=("${NORMALIZED_DOCKERHUB_REPO}")
          fi

          LOGIN_ALIYUN="false"
          if [ "${PUSH_ALIYUN}" = "true" ]; then
            LOGIN_ALIYUN="true"
          fi

          {
            echo "should_push=${SHOULD_PUSH}"
            echo "login_dockerhub=${HAS_DOCKERHUB_CREDS}"
            echo "login_aliyun=${LOGIN_ALIYUN}"
            echo "aliyun_registry_host=${ALIYUN_HOST}"
            echo "images<<EOF_IMAGES"
            printf '%s\n' "${IMAGES[@]}"
            echo "EOF_IMAGES"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ steps.targets.outputs.login_dockerhub == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: ${{ steps.targets.outputs.login_aliyun == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.targets.outputs.aliyun_registry_host }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.caddy_version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.targets.outputs.should_push == 'true' }}
          build-args: CADDY_VERSION=${{ steps.version.outputs.caddy_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ steps.targets.outputs.should_push == 'true' && 'type=gha,mode=max' || '' }}
          provenance: false

      - name: Write job summary
        if: ${{ success() }}
        shell: bash
        env:
          CADDY_VERSION: ${{ steps.version.outputs.caddy_version }}
          SHOULD_PUSH: ${{ steps.targets.outputs.should_push }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Docker Build Summary"
            echo ""
            echo "- **CADDY_VERSION**: \`${CADDY_VERSION}\`"
            echo "- **Platforms**: \`linux/amd64, linux/arm64\`"
            echo "- **Pushed**: \`${SHOULD_PUSH}\`"
            echo "- **Digest**: \`${DIGEST:-N/A}\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "> \`latest\` 未自动更新；验证通过后请在 **Actions -> Promote to Latest** 手动触发升级。"
          } >> "$GITHUB_STEP_SUMMARY"
